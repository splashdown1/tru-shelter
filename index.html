<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12160f">
<title>TRU SHELTER</title>
<style>
:root{--bg:#12160f;--ink:#eef3e4;--dim:#b4c2a4;--line:#2c3826;--leaf:#c6d86a;--card:#1c2418;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0e120c;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>SHELTER</span></h1><p class="sub">Site, size, poncho lean-to. FM 21-76. Not a snow cave.</p></header>
<div class="warn">Do not bed in a dry wash, under a dead limb, or on a slope that sheds rock. A fire sits in relation to the shelter, not in it.</div>
<div class="bar"><input id="q" placeholder="site, size, lean-to…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Too large",d:"The most common error is to make the shelter too large. It must be large enough to protect you, and small enough to hold your body heat, especially in the cold."},
{t:"BLISS",d:"Blend in with the surroundings. Low silhouette. Irregular shape. Small. Secluded. Winter wants a break from wind, with fuel and water in reach. Summer in the same country wants water and a site as free of insects as you can find."},
{t:"Ground",d:"Level enough to lie on. Water must leave the floor, not pool on it. Check the wind before you pick the trees or the poles. The back of a lean-to faces the wind."},
{t:"Poncho lean-to",d:"A poncho, 2 to 3 meters of rope or suspension line, three stakes about 30 centimeters, and two trees or two poles 2 to 3 meters apart. Back into the wind. If you will use it more than one night, or you expect rain, add a center support."},
{t:"Fire beside it",d:"The shelter is the windbreak. The fire is outside, on the open side, on a circle scraped to soil. TRU Fire holds the circle, the fuel ladder, and dead-out. This card does not light anything."},
{t:"Gap",d:"No snow cave, no debris-hut thickness, no insulation number. Those depend on the snow and the night, and this ship will not invent them. Knots are TRU Cord. Square and brace are TRU Build. Lifeline holds the rest of the survival book."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">SHELTER</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 21-76 shelters: size, BLISS, poncho lean-to 2 to 3 meters, stakes about 30 centimeters. Snow cave is not packed.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented snow cave.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
